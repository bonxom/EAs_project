[project]
name = "mini-moh"
version = "0.1.0"
description = "Reproducible two-level heuristic optimization for TSP"
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy>=2.5.3",
    "openai>=3.19.2",
    "pydantic>=2.13.5",
    "pyyaml>=6.0.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/moh"]

[tool.ruff]
target-version = "py312"

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.8",
]

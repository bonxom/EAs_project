defaults:
  - _self_
  - problem: tsp_gls
  - llm_client@heu: openai
  - llm_client@meta: openai
  
  - override hydra/output: local
  - override hydra/job_logging: colorlog
  - override hydra/hydra_logging: colorlog

hydra:
  job:
    name: ${problem.problem_name}-${problem.problem_size}
    chdir: True




n_iterations: 10              # ← config["n_iterations"]
seed: 0                       # deterministic population selection and optimizer RNG
pop_size: 10                  # ← config["population_size"]
timeout: 90                   # ← per-heuristic evaluation timeout (seconds)
optimizer_timeout: 3600       # wall time limit for a generated optimizer (seconds)
max_eval_calls: 1000          # per-subtask eval budget, total = this × N_subtasks. -1 for unlimited
seed_max_attempts: 15         # max seed-generation rounds before accepting partial population
isolate_base_solutions: false # false = shared problems/<name>/solution_*.json; true = run-local base_solutions/

# Shared provider-call budget for heuristic + meta LLM roles (null = unlimited).
provider_budget:
  max_requests: null          # successful provider requests (one per logical prompt)
  max_attempts: null          # provider attempts including retries
  max_retries_per_call: 10    # BaseClient._single_call retry cap


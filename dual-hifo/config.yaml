sizes: [20, 50, 100, 200]
n_instances: 100
random_seed: 2024

# null: pass every unvisited node to the generated heuristic.
neighbor_size: null

outer:
  pop_size: 2
  n_pop: 2
  m: 2
  operators: [i1, e1, e2, m1, m2, m3]
  operator_weights: [1, 1, 1, 1, 1, 1]

inner:
  pop_size: 2
  n_pop: 3
  m: 2
  operators: [e1, m1, m2, m3]
  operator_weights: [1, 2, 1, 1]
  meta_offspring: 1

llm:
  model: ag/gemini-3.7-flash-low
  base_url: http://localhost:20128/v1
  api_key: ""
  api_key_env: LLM_API_KEY
  temperature: 0.8
  timeout: 180
  max_retries: 3

output_dir: runs
